<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Proportional Impact — Gun Deaths by Race & Sex</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #181818;
    color: #e8e8e8;
    font-family: Arial, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #header {
    text-align: center;
    padding: 12px 20px 5px;
    flex-shrink: 0;
    background: #111;
    border-bottom: 1px solid #252525;
  }
  #header h1 { font-size: 15px; font-weight: 600; color: #fff; letter-spacing: .3px; margin-bottom: 3px; }
  #header p  { font-size: 10px; color: #666; }

  /* shared control bar styling */
  .ctrl-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 6px 20px;
    flex-shrink: 0;
    background: #1a1a1a;
    border-bottom: 1px solid #222;
    flex-wrap: wrap;
  }
  .ctrl-group { display: flex; align-items: center; gap: 8px; }
  .ctrl-group label { font-size: 11px; color: #888; white-space: nowrap; }
  select.ctrl-select {
    background: #242424; color: #eee;
    border: 1px solid #383838; padding: 4px 12px;
    font-size: 12px; border-radius: 5px; cursor: pointer; outline: none;
  }
  select.ctrl-select:hover { border-color: #c0392b; }

  .toggle-wrap { display: flex; }
  .tog-btn {
    background: #242424; color: #888;
    border: 1px solid #383838; padding: 4px 16px;
    font-size: 12px; cursor: pointer; transition: all .15s;
  }
  .tog-btn:first-child { border-radius: 5px 0 0 5px; }
  .tog-btn:last-child  { border-radius: 0 5px 5px 0; border-left: none; }
  .tog-btn.active      { background: #c0392b; color: #fff; border-color: #c0392b; }
  .tog-btn:hover:not(.active) { color: #ccc; }

  /* legend row */
  #legend {
    display: flex; align-items: center; justify-content: center;
    gap: 22px; padding: 4px 0 2px; flex-shrink: 0;
  }
  .leg-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #999; }
  .leg-swatch { width: 13px; height: 13px; border-radius: 3px; }

  /* section labels */
  .section-label {
    font-size: 10px; color: #555; text-align: center;
    padding: 3px 0 1px; flex-shrink: 0;
    letter-spacing: .5px; text-transform: uppercase;
  }

  #bar-div   { flex: 0 0 44%; min-height: 0; }
  #divider   { height: 1px; background: #202020; flex-shrink: 0; margin: 2px 0; }
  #rate-div  { flex: 1; min-height: 0; }
</style>
</head>
<body>

<div id="header">
  <h1>Proportional Impact &nbsp;·&nbsp; Gun Deaths Relative to Population</h1>
  <p>Compare each group's share of the population against their share of gun deaths, and see the rate per 100k of their own population</p>
</div>

<!-- Top chart controls -->
<div class="ctrl-bar">
  <div class="ctrl-group">
    <label>Year</label>
    <select id="yearSelectTop" class="ctrl-select" onchange="updateTop(parseInt(this.value))"></select>
  </div>
  <div class="ctrl-group">
    <label>View by</label>
    <div class="toggle-wrap">
      <button class="tog-btn active" id="btn-race" onclick="switchView('race')">Race</button>
      <button class="tog-btn"        id="btn-sex"  onclick="switchView('sex')">Sex</button>
    </div>
  </div>
</div>

<div id="legend">
  <div class="leg-item">
    <div class="leg-swatch" style="background:#fca982;"></div>
    <span>% of population</span>
  </div>
  <div class="leg-item">
    <div class="leg-swatch" style="background:#c0392b;"></div>
    <span>% of gun deaths</span>
  </div>
</div>

<div id="bar-div"></div>
<div id="divider"></div>

<!-- Bottom chart controls -->
<div class="ctrl-bar" style="border-top:1px solid #222; border-bottom:none; padding:5px 20px;">
  <div class="ctrl-group">
    <label>Deaths per 100k &nbsp;·&nbsp; Year</label>
    <select id="yearSelectBot" class="ctrl-select" onchange="updateBot(parseInt(this.value))"></select>
  </div>
</div>

<div id="rate-div"></div>

const GC            = {"Black / AA": "#e74c3c", "White": "#5dade2", "Amer. Indian / AK": "#f39c12", "Asian / PI": "#a29bfe", "Asian": "#8e44ad", "Native Hawaiian / PI": "#27ae60", "Male": "#3498db", "Female": "#e91e8c"};
const YEARS         = ["1999", "2000", "2001", "2002", "2003", "2004", "2005", "2006", "2007", "2008", "2009", "2010", "2011", "2012", "2013", "2014", "2015", "2016", "2017", "2018", "2019", "2020", "2021", "2022", "2023", "2024"];

let currentView = 'race';
let topIdx = YEARS.length - 1;
let botIdx = YEARS.length - 1;

// Populate both year dropdowns (newest first)
function fillDropdown(id, currentIdx, onchange) {
  const sel = document.getElementById(id);
  [...YEARS].reverse().forEach(y => {
    const opt = document.createElement('option');
    const idx = YEARS.indexOf(y);
    opt.value = idx; opt.text = y;
    if (idx === currentIdx) opt.selected = true;
    sel.appendChild(opt);
  });
}
fillDropdown('yearSelectTop', topIdx);
fillDropdown('yearSelectBot', botIdx);

function getTopBar()  { return currentView === 'race' ? RACE_BAR      : SEX_BAR;      }
function getBotBar()  { return currentView === 'race' ? RACE_RATE_BAR : SEX_RATE_BAR; }

// ── TOP chart: population % vs death % ────────────────────────────────────────
const topLayout = {
  paper_bgcolor: '#181818', plot_bgcolor: '#181818', font: { color: '#ddd' },
  barmode: 'group',
  xaxis: {
    range: [0, 102], ticksuffix: '%',
    tickfont: { size: 10, color: '#555' }, gridcolor: '#1e1e1e', zeroline: false,
  },
  yaxis: {
    tickfont: { size: 10, color: '#bbb' }, gridcolor: '#1e1e1e', automargin: true,
  },
  margin: { t: 6, b: 28, l: 130, r: 20 },
  showlegend: false, bargap: 0.26, bargroupgap: 0.06,
};

function topTraces(yd) {
  const hovPop = yd.groups.map((g, i) =>
    `<b>${g}</b><br>Population share: <b>${yd.pop_share[i]}%</b><br>Population: ${yd.pop[i].toLocaleString()}<extra></extra>`);
  const hovDth = yd.groups.map((g, i) =>
    `<b>${g}</b><br>Death share: <b>${yd.death_share[i]}%</b><br>Deaths: ${yd.deaths[i].toLocaleString()}<br>Rate: ${yd.rate[i]}/100k<br>Disparity: <b>${yd.ratio[i]}× national avg</b><extra></extra>`);
  return [
    { type:'bar', orientation:'h', x:yd.pop_share, y:yd.groups,
      marker:{ color:'#fca982', opacity:0.88 },
      text:yd.pop_share.map(v=>v+'%'), textposition:'outside', textfont:{size:9,color:'#999'},
      hovertemplate:'%{customdata}', customdata:hovPop },
    { type:'bar', orientation:'h', x:yd.death_share, y:yd.groups,
      marker:{ color:'#c0392b', opacity:0.92 },
      text:yd.death_share.map(v=>v+'%'), textposition:'outside', textfont:{size:9,color:'#eee'},
      hovertemplate:'%{customdata}', customdata:hovDth },
  ];
}

// ── BOTTOM chart: deaths per 100k (own pop), sorted bars ─────────────────────
const botLayout = {
  paper_bgcolor: '#181818', plot_bgcolor: '#181818', font: { color: '#ddd' },
  xaxis: {
    title: { text: 'Deaths per 100k of own group population', font: { size: 10 } },
    tickfont: { size: 10, color: '#555' }, gridcolor: '#1e1e1e', zeroline: false,
  },
  yaxis: {
    tickfont: { size: 11, color: '#ddd' }, gridcolor: '#1e1e1e', automargin: true,
  },
  margin: { t: 6, b: 36, l: 150, r: 20 },
  showlegend: false, bargap: 0.28,
};

function botTraces(rd) {
  const colors = rd.groups.map(g => GC[g] || '#fc8d59');
  const hov = rd.groups.map((g, i) =>
    `<b>${g}</b><br>Rate: <b>${rd.rates[i]}/100k</b><br>Deaths: ${rd.deaths[i].toLocaleString()}<br>Population: ${rd.pop[i].toLocaleString()}<br>Disparity: <b>${rd.ratio[i]}× national avg</b><extra></extra>`);
  return [{
    type: 'bar', orientation: 'h',
    x: rd.rates, y: rd.groups,
    marker: { color: colors, opacity: 0.9, line: { color: 'rgba(0,0,0,0.2)', width: 0.5 } },
    text: rd.rates.map(r => r + '/100k'),
    textposition: 'outside', textfont: { size: 9, color: '#ccc' },
    hovertemplate: '%{customdata}', customdata: hov,
  }];
}

function maxRate() {
  const bd = getBotBar();
  return Math.max(...Object.values(bd).map(yd => Math.max(...yd.rates))) * 1.2;
}

// ── Initial render ────────────────────────────────────────────────────────────
const topYd0 = getTopBar()[YEARS[topIdx]];
const botRd0 = getBotBar()[YEARS[botIdx]];

Plotly.newPlot('bar-div',  topTraces(topYd0), topLayout, { responsive:true, displayModeBar:false });
Plotly.newPlot('rate-div', botTraces(botRd0),
  { ...botLayout, xaxis: { ...botLayout.xaxis, range: [0, maxRate()] } },
  { responsive:true, displayModeBar:false });

function updateTop(idx) {
  topIdx = idx;
  const yd = getTopBar()[YEARS[idx]];
  if (!yd) return;
  Plotly.react('bar-div', topTraces(yd), topLayout, { responsive:true, displayModeBar:false });
}

function updateBot(idx) {
  botIdx = idx;
  const rd = getBotBar()[YEARS[idx]];
  if (!rd) return;
  const layout = { ...botLayout, xaxis: { ...botLayout.xaxis, range: [0, maxRate()] } };
  Plotly.react('rate-div', botTraces(rd), layout, { responsive:true, displayModeBar:false });
}

function switchView(v) {
  currentView = v;
  document.getElementById('btn-race').classList.toggle('active', v === 'race');
  document.getElementById('btn-sex').classList.toggle('active',  v === 'sex');
  updateTop(topIdx);
  updateBot(botIdx);
}
