// ── BAR CHART ─────────────────────────────────────────────────────────────────
const POP_COLOR   = '#8d99ae';
const DEATH_COLOR = '#d7301f';
const barLayout = {
  paper_bgcolor:'#1a1a1a', plot_bgcolor:'#1a1a1a', font:{color:'#eee'},
  barmode:'group',
  xaxis:{title:'Share of national total (%)', titlefont:{size:11},
         tickfont:{size:9,color:'#aaa'}, gridcolor:'#282828', zeroline:false,
         range:[0,105]},
  yaxis:{tickfont:{size:9,color:'#ccc'}, gridcolor:'#282828', automargin:true},
  margin:{t:6,b:34,l:130,r:16},
  showlegend:true,
  legend:{x:0.72,y:1.06,orientation:'h',font:{size:10,color:'#ccc'},
          bgcolor:'rgba(0,0,0,0)'},
  bargap:0.22, bargroupgap:0.06,
};

function barTraces(yd) {
  const hov_pop   = yd.groups.map((g,i) =>
    `<b>${g}</b><br>Population share: <b>${yd.pop_share[i]}%</b><br>Population: ${yd.pop[i].toLocaleString()}`);
  const hov_death = yd.groups.map((g,i) =>
    `<b>${g}</b><br>Death share: <b>${yd.death_share[i]}%</b><br>Deaths: ${yd.deaths[i].toLocaleString()}<br>Rate: ${yd.rate[i]}/100k<br>Disparity: <b>${yd.ratio[i]}×</b> national avg`);
  return [
    {type:'bar', orientation:'h', name:'% of population',
     x:yd.pop_share, y:yd.groups, marker:{color:POP_COLOR, opacity:0.85},
     customdata:hov_pop, hovertemplate:'%{customdata}<extra></extra>',
     text:yd.pop_share.map(v=>`${v}%`), textposition:'outside', textfont:{size:9,color:'#aaa'}},
    {type:'bar', orientation:'h', name:'% of gun deaths',
     x:yd.death_share, y:yd.groups, marker:{color:DEATH_COLOR, opacity:0.9},
     customdata:hov_death, hovertemplate:'%{customdata}<extra></extra>',
     text:yd.death_share.map(v=>`${v}%`), textposition:'outside', textfont:{size:9,color:'#fff'}},
  ];
}

// ── TREND CHART ────────────────────────────────────────────────────────────────
const trendLayout = {
  paper_bgcolor:'#1a1a1a', plot_bgcolor:'#1a1a1a', font:{color:'#eee'},
  xaxis:{title:'Year', titlefont:{size:10}, tickfont:{size:9,color:'#aaa'},
         gridcolor:'#242424', dtick:3},
  yaxis:{title:'Deaths per 100k (own pop)', titlefont:{size:10},
         tickfont:{size:9,color:'#aaa'}, gridcolor:'#242424', zeroline:false},
  margin:{t:6,b:36,l:58,r:16},
  showlegend:true,
  legend:{x:0,y:1.04,orientation:'h',font:{size:9,color:'#ccc'},
          bgcolor:'rgba(0,0,0,0)'},
  hovermode:'x unified',
};

function trendTraces(trend, yearIdx) {
  const selYear = parseInt(YEARS[yearIdx]);
  const traces = Object.entries(trend).map(([grp, td]) => ({
    type:'scatter', mode:'lines+markers', name:grp,
    x:td.years, y:td.rates,
    line:{color:GC[grp]||'#aaa', width:2},
    marker:{size:4},
    customdata:td.rates.map((r,i)=>`<b>${grp}</b>: ${r}/100k  (${td.ratios[i]}× avg)`),
    hovertemplate:'%{customdata}<extra></extra>',
  }));
  // Year indicator line
  traces.push({
    type:'scatter', mode:'lines', name:'Selected year',
    x:[selYear,selYear], y:[0,999], showlegend:false,
    line:{color:'rgba(255,255,255,0.25)', width:1.5, dash:'dot'},
    hoverinfo:'skip',
  });
  return traces;
}

// ── Initial render ─────────────────────────────────────────────────────────────
function getYd() { return getBar()[YEARS[currentIdx]]; }

Plotly.newPlot('bar-div',   barTraces(getYd()),                    barLayout,   {responsive:true,displayModeBar:false});
Plotly.newPlot('trend-div', trendTraces(getTrend(), currentIdx),   trendLayout, {responsive:true,displayModeBar:false});

// ── Update ────────────────────────────────────────────────────────────────────
function update(idx) {
  currentIdx = idx;
  document.getElementById('yearLabel').textContent = YEARS[idx];
  document.getElementById('yearSlider').value = idx;
  const yd = getYd();
  if (!yd) return;
  Plotly.react('bar-div',   barTraces(yd),                   barLayout,   {responsive:true,displayModeBar:false});
  Plotly.react('trend-div', trendTraces(getTrend(), idx),    trendLayout, {responsive:true,displayModeBar:false});
}

function switchView(v) {
  currentView = v;
  document.getElementById('btn-race').classList.toggle('active', v==='race');
  document.getElementById('btn-sex').classList.toggle('active',  v==='sex');
  update(currentIdx);
}

document.getElementById('yearSlider').addEventListener('input', function() {
  stopPlay(); update(parseInt(this.value));
});

function stopPlay() {
  playing=false; clearInterval(playTimer);
  document.getElementById('playBtn').textContent='▶ Play';
}
document.getElementById('playBtn').addEventListener('click', function() {
  if (playing) { stopPlay(); return; }
  playing=true; this.textContent='⏸ Pause';
  if (currentIdx >= YEARS.length-1) currentIdx=-1;
  playTimer=setInterval(function(){
    currentIdx++;
    update(currentIdx);
    if (currentIdx>=YEARS.length-1) stopPlay();
  }, 700);
});
