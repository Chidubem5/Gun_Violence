// Red-orange color scale: maps rate to color
function rateToColor(rate, maxRate) {
  const t = Math.min(rate / maxRate, 1);
  // interpolate: low=#fcc4aa mid=#fc8d59 high=#d7301f darkest=#7f0000
  const stops = [
    [0,   [252,196,170]],
    [0.4, [252,141, 89]],
    [0.7, [215, 48, 31]],
    [1.0, [127,  0,  0]],
  ];
  let c = stops[0][1];
  for (let i = 1; i < stops.length; i++) {
    if (t <= stops[i][0]) {
      const lo = stops[i-1], hi = stops[i];
      const f = (t - lo[0]) / (hi[0] - lo[0]);
      c = lo[1].map((v,j) => Math.round(v + f * (hi[1][j] - v)));
      break;
    }
    c = stops[stops.length-1][1];
  }
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

function makeFrame(yearData, year, maxRate) {
  const colors = yearData.r.map(r => rateToColor(r, maxRate));
  return {
    name: year,
    data: [{
      x: yearData.s,
      y: yearData.r,
      marker: { color: colors },
      text: yearData.r.map((r, i) => `${yearData.d[i].toLocaleString()} deaths<br>${r}/100k`),
      hovertemplate: '<b>%{x}</b><br>%{text}<extra></extra>',
    }]
  };
}

function buildChart(race) {
  const raceData = ALL_DATA[race];
  const availYears = YEARS.filter(y => raceData[y]);
  if (availYears.length === 0) return;

  // Find global max rate for consistent color scale within this race group
  let maxRate = 0;
  availYears.forEach(y => {
    const m = Math.max(...raceData[y].r);
    if (m > maxRate) maxRate = m;
  });

  const firstYear = availYears[0];
  const firstData = raceData[firstYear];
  const initColors = firstData.r.map(r => rateToColor(r, maxRate));

  const frames = availYears.map(y => makeFrame(raceData[y], y, maxRate));

  const layout = {
    paper_bgcolor: '#1a1a1a',
    plot_bgcolor: '#1a1a1a',
    font: { color: '#eee' },
    xaxis: {
      tickangle: -45,
      tickfont: { size: 10, color: '#ccc' },
      gridcolor: '#333',
      linecolor: '#444',
      automargin: true,
    },
    yaxis: {
      title: 'Deaths per 100k (total state pop)',
      titlefont: { size: 12 },
      gridcolor: '#333',
      linecolor: '#444',
      zeroline: false,
    },
    margin: { t: 20, b: 120, l: 70, r: 20 },
    showlegend: false,
    updatemenus: [{
      type: 'buttons',
      showactive: false,
      x: 0.05, xanchor: 'left',
      y: -0.22, yanchor: 'top',
      bgcolor: '#333', bordercolor: '#555',
      font: { color: '#fff' },
      buttons: [
        {
          label: '▶ Play',
          method: 'animate',
          args: [null, { fromcurrent: true, transition: { duration: 300 }, frame: { duration: 500, redraw: true } }]
        },
        {
          label: '⏸ Pause',
          method: 'animate',
          args: [[null], { mode: 'immediate', transition: { duration: 0 }, frame: { duration: 0, redraw: false } }]
        }
      ]
    }],
    sliders: [{
      active: 0,
      steps: availYears.map((y, i) => ({
        label: y, method: 'animate',
        args: [[y], { mode: 'immediate', transition: { duration: 200 }, frame: { duration: 300, redraw: true } }]
      })),
      x: 0.05, len: 0.95,
      y: -0.12,
      currentvalue: { prefix: 'Year: ', font: { size: 14, color: '#fff' } },
      font: { color: '#aaa' },
      bgcolor: '#333',
      bordercolor: '#555',
      tickcolor: '#555',
    }]
  };

  Plotly.newPlot('chart', [{
    type: 'bar',
    x: firstData.s,
    y: firstData.r,
    marker: { color: initColors },
    text: firstData.r.map((r, i) => `${firstData.d[i].toLocaleString()} deaths<br>${r}/100k`),
    hovertemplate: '<b>%{x}</b><br>%{text}<extra></extra>',
  }], layout, { responsive: true, displayModeBar: false })
  .then(() => Plotly.addFrames('chart', frames));
}

// Populate dropdown
const sel = document.getElementById('raceSelect');
Object.keys(ALL_DATA).forEach(race => {
  const opt = document.createElement('option');
  opt.value = race; opt.text = race;
  sel.appendChild(opt);
});

// Build initial chart
buildChart(Object.keys(ALL_DATA)[0]);
