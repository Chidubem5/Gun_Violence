function rateColor(rate, maxRate) {
  const t = Math.min(rate / maxRate, 1);
  const stops = [[0,[252,245,240]],[0.2,[252,196,170]],[0.4,[252,141,89]],[0.65,[215,48,31]],[1.0,[127,0,0]]];
  let c = stops[0][1];
  for (let i=1;i<stops.length;i++){
    if(t<=stops[i][0]){const lo=stops[i-1],hi=stops[i],f=(t-lo[0])/(hi[0]-lo[0]);c=lo[1].map((v,j)=>Math.round(v+f*(hi[1][j]-v)));break;}
    c=stops[stops.length-1][1];
  }
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function buildChart(race){
  const rd=ALL_DATA[race];
  const avail=YEARS.filter(y=>rd[y]);
  if(!avail.length)return;
  let maxRate=0;
  avail.forEach(y=>{const m=Math.max(...rd[y].r);if(m>maxRate)maxRate=m;});
  const frames=avail.map(y=>{
    const d=rd[y],colors=d.r.map(r=>rateColor(r,maxRate));
    return{name:y,data:[{type:'bar',orientation:'h',x:d.r,y:d.s,
      marker:{color:colors},
      text:d.r.map((r,i)=>`${r}`),textposition:'outside',textfont:{size:9,color:'#ccc'},
      customdata:d.r.map((r,i)=>`<b>${d.s[i]}</b><br>Rate: <b>${r}/100k</b> of ${race} pop<br>Deaths: ${d.d[i].toLocaleString()}<br>${race} population: ${d.p[i].toLocaleString()}`),
      hovertemplate:'%{customdata}<extra></extra>'}]};
  });
  const layout={
    paper_bgcolor:'#1a1a1a',plot_bgcolor:'#1a1a1a',font:{color:'#eee'},
    xaxis:{title:'Deaths per 100k (race population)',titlefont:{size:11},tickfont:{size:9,color:'#aaa'},gridcolor:'#333',zeroline:false,range:[0,maxRate*1.18]},
    yaxis:{tickfont:{size:9,color:'#ccc'},autorange:'reversed',gridcolor:'#333'},
    margin:{t:4,b:40,l:140,r:60},showlegend:false,bargap:0.25,
    updatemenus:[{type:'buttons',showactive:false,x:0.05,xanchor:'left',y:-0.1,yanchor:'top',
      bgcolor:'#333',bordercolor:'#555',font:{color:'#fff'},
      buttons:[
        {label:'▶ Play',method:'animate',args:[null,{fromcurrent:true,transition:{duration:0},frame:{duration:650,redraw:true}}]},
        {label:'⏸ Pause',method:'animate',args:[[null],{mode:'immediate',transition:{duration:0},frame:{duration:0,redraw:false}}]}
      ]}],
    sliders:[{active:0,steps:avail.map((y,i)=>
      ({label:y,method:'animate',args:[[y],{mode:'immediate',transition:{duration:0},frame:{duration:0,redraw:true}}]})),
      x:0.05,len:0.95,y:-0.04,
      currentvalue:{prefix:'Year: ',font:{size:14,color:'#fff'}},
      font:{color:'#aaa'},bgcolor:'#333',bordercolor:'#555',tickcolor:'#555'}]
  };
  const first=rd[avail[0]];
  Plotly.newPlot('chart',[{type:'bar',orientation:'h',x:first.r,y:first.s,
    marker:{color:first.r.map(r=>rateColor(r,maxRate))},
    text:first.r.map(r=>`${r}`),textposition:'outside',textfont:{size:9,color:'#ccc'},
    customdata:first.r.map((r,i)=>`<b>${first.s[i]}</b><br>Rate: <b>${r}/100k</b> of ${race} pop<br>Deaths: ${first.d[i].toLocaleString()}<br>${race} population: ${first.p[i].toLocaleString()}`),
    hovertemplate:'%{customdata}<extra></extra>'
  }],layout,{responsive:true,displayModeBar:false}).then(()=>Plotly.addFrames('chart',frames));
}
